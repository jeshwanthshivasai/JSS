<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- Background Yellow Avatar Color -->
    <path id="bgShape" d="M 250 10 L 450 100 L 490 300 L 350 490 L 150 490 L 10 300 L 50 100 Z" />
  </defs>
  
  <!-- Solid Yellow Hexagon Base -->
  <use href="#bgShape" fill="#fce883" />

  <g stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hat -->
    <path d="M120 180 L380 150 C380 150 360 100 300 100 L170 110 Z" />
    <path d="M100 200 C150 180 300 150 400 160" />

    <!-- Face Outline -->
    <path d="M150 250 C120 350 150 450 250 460 C350 450 360 300 380 200" />
    
    <!-- Glasses -->
    <path d="M140 230 C 130 250 180 260 200 220 L 210 210 M 230 220 C 240 250 300 240 310 200" />
    <path d="M150 210 L190 200 L200 230 L140 240 Z" />
    <path d="M240 200 L290 190 L310 220 L240 230 Z" />
    
    <!-- Eyes -->
    <path d="M155 225 C165 220 175 225 185 220" />
    <path d="M255 210 C265 205 275 210 285 205" />

    <!-- Nose -->
    <path d="M210 250 L190 280 C210 290 230 280 240 270" />

    <!-- Mustache -->
    <path d="M150 315 C180 300 210 320 230 300 C240 305 260 300 280 305" />

    <!-- Beard Hint -->
    <path d="M215 340 L 215 350 M225 340 L 225 350" />
    <path d="M160 325 C190 340 220 320 250 310" />

    <!-- Ear / Pencil Grip -->
    <path d="M340 200 C360 210 370 240 360 260 C340 270 330 230 340 200" />
    <path d="M330 215 L320 240 M325 245 C340 260 360 300 330 320" />
    
  </g>

  <!-- Red Pencil -->
  <g stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 255 L380 200" fill="#e63946" />
    <path d="M260 255 L250 260 L262 250 Z" fill="#fff" /> <!-- Pencil Tip -->
    <path d="M261 254 L255 257 Z" fill="#000" /> <!-- Lead -->
  </g>
</svg>
